  // ---------- Profile (online if signed in, otherwise local) ----------
  function me() {
    const local = store.get('profile', {}) || {};
    if (Online.profile) return Object.assign({}, local, Online.profile, { online: true });
    return Object.assign({ name: '', xp: Online.START_XP, wins: 0, losses: 0, draws: 0 }, local, { online: false });
  }
  const myName = () => me().name || T('Ты', 'You');

  // ---------- Stats, history, lessons ----------
  const Stats = {
    botWin(level) { const w = store.get('botWins', {}); w[level] = (w[level] || 0) + 1; store.set('botWins', w); },
    botWins(level) { return (store.get('botWins', {})[level]) || 0; },
    friend() { store.set('friendGames', store.get('friendGames', 0) + 1); },
    day() { const d = new Date().toISOString().slice(0, 10); const days = new Set(store.get('days', [])); days.add(d); store.set('days', Array.from(days).sort().slice(-400)); },
    streak() {
      const days = new Set(store.get('days', []));
      const fmt = (dt) => dt.toISOString().slice(0, 10);
      const d = new Date();
      if (!days.has(fmt(d))) d.setDate(d.getDate() - 1);
      let n = 0;
      while (days.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }
  };
  const History = {
    all() { return store.get('history', []); },
    add(g) { store.set('history', [g].concat(this.all()).slice(0, 40)); }
  };
  const BOOK = window.LESSONS.chapters;
  const ALL_LESSONS = BOOK.flatMap((c) => c.lessons);
  const Lessons = {
    done() { return new Set(store.get('lessonsDone', [])); },
    complete(id) { const d = this.done(); d.add(id); store.set('lessonsDone', Array.from(d)); },
    next() {
      const done = this.done(), start = Math.max(0, ALL_LESSONS.findIndex((l) => l.id === store.get('startLesson', 'hello')));
      return ALL_LESSONS.slice(start).find((l) => !done.has(l.id)) || ALL_LESSONS.find((l) => !done.has(l.id)) || null;
    }
  };

  function achievements() {
    const p = me(), done = Lessons.done().size, streak = Stats.streak();
    const list = [
      ['📘', T('Первый урок', 'First lesson'), T('Пройди любой урок', 'Finish any lesson'), done >= 1],
      ['📚', T('Прилежный ученик', 'Keen student'), T('Пройди 10 уроков', 'Finish 10 lessons'), done >= 10],
      ['🎓', T('Выпускник Бобика', "Bobik's graduate"), T('Пройди все уроки', 'Finish every lesson'), done >= ALL_LESSONS.length]
    ];
    for (const l of LEVELS) list.push([l.emoji, T('Победил: ', 'Beat: ') + levelTitle(l), T(`Обыграй Бобика уровня «${l.ru}» (${l.xp} XP)`, `Beat Bobik at ${l.en} (${l.xp} XP)`), Stats.botWins(l.id) > 0]);
    list.push(
      ['🌍', T('Первая онлайн-победа', 'First online win'), T('Выиграй рейтинговую партию', 'Win a ranked game'), (p.wins || 0) >= 1],
      ['🏅', T('Десятка', 'Perfect ten'), T('10 онлайн-побед', '10 online wins'), (p.wins || 0) >= 10],
      ['💎', '500 XP', T('Набери 500 XP', 'Reach 500 XP'), (p.xp || 0) >= 500],
      ['🏆', '1000 XP', T('Набери 1000 XP', 'Reach 1000 XP'), (p.xp || 0) >= 1000],
      ['🤝', T('Дружеская партия', 'Friendly game'), T('Сыграй с другом по коду', 'Play a friend with a code'), store.get('friendGames', 0) >= 1],
      ['🔥', T('3 дня подряд', '3-day streak'), T('Занимайся 3 дня подряд', 'Practise 3 days in a row'), streak >= 3],
      ['☄️', T('Неделя подряд', '7-day streak'), T('Занимайся 7 дней подряд', 'Practise 7 days in a row'), streak >= 7]
    );
    return list.map(([emoji, title, detail, on]) => ({ emoji, title, detail, on }));
  }

  // ---------- Root, tabs ----------
  const root = $('#app');
  let tab = 'learn';
  const TABS = [['learn', '🎓', () => T('Учёба', 'Learn')], ['play', '♟️', () => T('Играть', 'Play')], ['rating', '🏆', () => T('Рейтинг', 'Rating')], ['profile', '👤', () => T('Профиль', 'Profile')]];

  function renderShell() {
    root.innerHTML = `<main id="main"></main><nav class="tabbar" aria-label="${T('Разделы', 'Sections')}"><div class="inner">${TABS.map(([id, ico, name]) =>
      `<button class="tab ${id === tab ? 'on' : ''}" data-tab="${id}" aria-current="${id === tab ? 'page' : 'false'}"><span class="ico">${ico}</span>${name()}</button>`).join('')}</div></nav>`;
    $$('.tab', root).forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; renderShell(); window.scrollTo(0, 0); }));
    renderTab();
  }

  function renderTab() {
    const main = $('#main');
    if (!main) return;
    ({ learn: renderLearn, play: renderPlay, rating: renderRating, profile: renderProfile })[tab](main);
  }

  Online.onChange(() => { if ($('#main') && (tab === 'profile' || tab === 'rating' || tab === 'play')) renderTab(); });

  // ---------- Learn ----------
  function renderLearn(main) {
    const done = Lessons.done(), next = Lessons.next();
    main.innerHTML = `<div class="page stack">
      <h1 class="page-title">${T('Учёба с Бобиком', 'Learn with Bobik')}</h1>
      <div class="card stack">
        <div class="row">${bobik(76)}<div class="grow"><p class="h">${T('Привет! Учимся дальше?', 'Hi! Shall we keep learning?')}</p>
          <div class="muted small">${T(`Пройдено уроков: ${done.size} из ${ALL_LESSONS.length}`, `Lessons done: ${done.size} of ${ALL_LESSONS.length}`)}</div></div></div>
        <div class="progress"><i style="width:${(done.size / ALL_LESSONS.length) * 100}%"></i></div>
        ${next ? `<button class="btn" data-lesson="${next.id}">▶ ${T('Продолжить', 'Continue')}: ${esc(T(next.ru, next.en))}</button>`
        : `<div class="success bold">${T('Ты прошёл все уроки! Теперь играй с Бобиком или онлайн 🏆', 'You finished every lesson! Now play Bobik or go online 🏆')}</div>`}
      </div>
      ${BOOK.map((c) => `<div class="stack" style="gap:10px"><h2 class="h" style="font-size:20px;margin:6px 4px 0">${esc(T(c.ru, c.en))}</h2>
        ${c.lessons.map((l) => `<button class="card tight lesson-row" data-lesson="${l.id}">
          <span class="lesson-ico ${done.has(l.id) ? 'done' : ''}">${done.has(l.id) ? '✓' : (ICONS[l.icon] || '♟️')}</span>
          <span class="grow bold">${esc(T(l.ru, l.en))}</span><span class="${done.has(l.id) ? 'success' : 'faint'}">${done.has(l.id) ? '✔︎' : '›'}</span></button>`).join('')}</div>`).join('')}
    </div>`;
    $$('[data-lesson]', main).forEach((b) => b.addEventListener('click', () => openLesson(ALL_LESSONS.find((l) => l.id === b.dataset.lesson))));
  }

  function openLesson(lesson) {
    if (!lesson) return;
    const scr = html(`<div class="overlay-screen" role="dialog" aria-label="${esc(T(lesson.ru, lesson.en))}"><div class="page stack" style="padding-bottom:30px;max-width:560px">
      <div class="row"><button class="icon-btn" data-x aria-label="${T('Закрыть', 'Close')}">✕</button>
        <div class="grow center bold">${esc(T(lesson.ru, lesson.en))}</div><div class="faint small bold" data-count style="width:44px;text-align:right"></div></div>
      <div class="progress"><i data-prog></i></div>
      <div data-says></div><div data-board></div><div data-controls class="row"></div></div></div>`);
    document.body.appendChild(scr);
    let index = 0, pos = null, last = 0, solved = false, feedback = null, good = true, hint = [], marked = null;
    const steps = lesson.steps;
    const step = () => steps[Math.min(index, steps.length - 1)];
    const isTask = (s) => !!(s.tap || s.move || s.mate);
    const isMate = (p) => Chess.inCheck(p) && !Chess.legal(p).length;
    const board = new Board($('[data-board]', scr), { onMove: (m) => onMove(m), onTap: null });
    const close = () => { scr.remove(); renderTab(); };
    $('[data-x]', scr).addEventListener('click', close);

    function load(i) {
      index = i; solved = false; feedback = null; hint = []; marked = null;
      let start = 0;
      for (let j = i; j >= 0; j--) if (steps[j].fen) { start = j; break; }
      let p = Chess.fromFEN(steps[start].fen || Chess.START_FEN), lm = 0;
      for (let j = start; j < i; j++) {
        const s = steps[j];
        if (j > start && s.fen) p = Chess.fromFEN(s.fen);
        if (s.move && s.move[0]) {
          const m = Chess.fromUci(s.move[0]);
          if (Chess.isLegal(p, m)) {
            p = Chess.make(p, m); lm = m;
            if (s.reply) { const r = Chess.fromUci(s.reply); if (Chess.isLegal(p, r)) { p = Chess.make(p, r); lm = r; } }
          }
        } else if (s.mate) {
          const m = Chess.legal(p).find((x) => isMate(Chess.make(p, x)));
          if (m) { p = Chess.make(p, m); lm = m; }
        }
      }
      pos = p; last = lm;
      draw();
    }

    function draw() {
      const s = step();
      $('[data-count]', scr).textContent = `${index + 1}/${steps.length}`;
      $('[data-prog]', scr).style.width = `${((index + (solved || !isTask(s) ? 1 : 0)) / steps.length) * 100}%`;
      $('[data-says]', scr).innerHTML = says(feedback || T(s.ru, s.en), feedback ? (good ? 'good' : 'bad') : '');
      const arrows = (s.ar || []).map(([a, b]) => [Chess.sqIndex(a), Chess.sqIndex(b)]).concat(hint);
      board.opts.onTap = s.tap && !solved ? onTap : null;
      board.set({ pos, last, highlights: new Set((s.hl || []).map(Chess.sqIndex)), arrows, marked, movable: (s.move || s.mate) && !solved ? pos.turn : null });
      const c = $('[data-controls]', scr);
      if (isTask(s) && !solved) {
        c.innerHTML = `<button class="btn soft" data-hint>💡 ${T('Подсказка', 'Hint')}</button>${s.move || s.mate ? `<button class="btn soft" data-reset>↺ ${T('Заново', 'Reset')}</button>` : ''}`;
        $('[data-hint]', c).addEventListener('click', showHint);
        const r = $('[data-reset]', c); if (r) r.addEventListener('click', () => load(index));
      } else {
        c.innerHTML = `<button class="btn" data-next>${index + 1 < steps.length ? T('Дальше', 'Next') : T('Завершить урок', 'Finish lesson')}</button>`;
        $('[data-next]', c).addEventListener('click', next);
      }
    }

    function praise() { const l = [T('Отлично! 👏', 'Excellent! 👏'), T('Верно! Так держать!', 'Correct! Keep it up!'), T('Супер! 🎉', 'Super! 🎉'), T('Молодец!', 'Well done!')]; return l[Math.floor(Math.random() * l.length)]; }

    function onTap(sq) {
      const s = step(), name = Chess.sqName(sq);
      if (s.tap.includes(name)) { marked = [sq, true]; solved = true; good = true; feedback = praise(); vibrate(20); sound.good(); }
      else { marked = [sq, false]; good = false; feedback = T(`Это ${name}. Попробуй ещё раз!`, `That's ${name}. Try again!`); vibrate([30, 40, 30]); sound.bad(); }
      draw();
    }

    function onMove(m) {
      const s = step();
      const ok = s.mate ? isMate(Chess.make(pos, m)) : (s.move || []).includes(Chess.uci(m));
      if (!ok) {
        good = false;
        feedback = s.mate ? T('Это не мат — у соперника есть ход. Подумай ещё!', "That's not mate — the opponent can still move. Think again!") : T('Не совсем. Попробуй другой ход!', 'Not quite. Try another move!');
        vibrate([30, 40, 30]); sound.bad(); board.rebuild(); draw();
        return;
      }
      (pos.b[Chess.mTo(m)] ? sound.capture : sound.move)();
      pos = Chess.make(pos, m); last = m; solved = true; good = true; hint = [];
      feedback = s.mate ? T('Мат! Ты победил! 🏆', 'Checkmate! You win! 🏆') : praise();
      vibrate(20);
      draw();
      if (s.reply) setTimeout(() => {
        const r = Chess.fromUci(s.reply);
        if (Chess.isLegal(pos, r)) { (pos.b[Chess.mTo(r)] ? sound.capture : sound.move)(); pos = Chess.make(pos, r); last = r; draw(); }
      }, 700);
    }

    function showHint() {
      const s = step();
      if (s.tap) {
        const t = s.tap[0];
        good = true; feedback = T(`Ищи букву ${t[0]} внизу доски и цифру ${t[1]} слева.`, `Find the letter ${t[0]} at the bottom and the number ${t[1]} on the left.`);
        marked = [Chess.sqIndex(t), true]; draw(); return;
      }
      let target = s.move ? Chess.fromUci(s.move[0]) : 0;
      if (s.mate) target = Chess.legal(pos).find((x) => isMate(Chess.make(pos, x))) || 0;
      if (target) { hint = [[Chess.mFrom(target), Chess.mTo(target)]]; good = true; feedback = T('Вот подсказка — смотри на стрелку.', "Here's a hint — follow the arrow."); draw(); }
    }

    function next() {
      if (index + 1 < steps.length) { load(index + 1); return; }
      Lessons.complete(lesson.id); Stats.day(); sound.win(); vibrate(40);
      modal(`${bobik(110)}<h2 style="margin:0">${T('Урок пройден! 🎉', 'Lesson complete! 🎉')}</h2>
        <div class="muted">${T('Ты молодец! Бобик гордится тобой.', 'Great job! Bobik is proud of you.')}</div>
        <button class="btn" data-close>${T('Готово', 'Done')}</button>`, close);
    }

    load(0);
  }

  // ---------- Modal ----------
  function modal(inner, onClose) {
    const m = html(`<div class="modal" role="dialog"><div class="sheet">${inner}</div></div>`);
    document.body.appendChild(m);
    const close = () => { m.remove(); if (onClose) onClose(); };
    $$('[data-close]', m).forEach((b) => b.addEventListener('click', close));
    return { el: m, close: () => m.remove() };
  }

  // ---------- Play ----------
  let lobby = { phase: 'idle', code: '', stop: null, error: '' };

      </div>
      <div class="card stack">

        ${!Online.configured ? '' : !signed ? `<button class="btn soft" data-need-account>${T('Войти', 'Sign in')}</button>`

        : lobby.phase === 'joining' ? `<div class="row"><div class="spinner"></div><span>${T('Подключаемся…', 'Joining…')}</span></div>`

           <div class="row"><input class="input code grow" maxlength="6" placeholder="${T('Код друга', "Friend's code")}" data-code autocomplete="off" autocapitalize="characters"><button class="btn" style="width:auto" data-join>${T('Войти', 'Join')}</button></div>`}
        ${lobby.error ? `<div class="danger small">${esc(lobby.error)}</div>` : ''}
      </div>
      <div class="card stack">
        <div class="row">${bobik(50, true)}<div><p class="h">${T('Сыграть с Бобиком', 'Play Bobik')}</p><div class="muted small">${T('Без интернета, с подсказками, ходом назад и оценкой', 'Offline, with hints, undo and review')}</div></div></div>
        <div class="stack" style="gap:8px">${LEVELS.map((l) => `<button class="level-row ${l.id === level ? 'on' : ''}" data-level="${l.id}">

          ${Stats.botWins(l.id) ? `<span class="small bold" style="color:var(--gold)">🏆${Stats.botWins(l.id)}</span>` : ''}
          <span style="color:${l.id === level ? 'var(--purple)' : 'var(--ink-3)'}">${l.id === level ? '●' : '○'}</span></button>`).join('')}</div>
        <div class="seg">${[['white', T('Белые', 'White')], ['random', T('Случайно', 'Random')], ['black', T('Чёрные', 'Black')]].map(([k, n]) => `<button class="${k === colorChoice ? 'on' : ''}" data-color="${k}">${n}</button>`).join('')}</div>
        <button class="btn" data-bot>▶ ${T('Начать', 'Start')} · ${levelTitle(LEVELS[level - 1])}</button>
      </div>
    </div>`;
    const on = (sel, fn) => $$(sel, main).forEach((b) => b.addEventListener('click', fn));
    on('[data-tc]', (e) => { store.set('tc', e.currentTarget.dataset.tc); renderTab(); });
    on('[data-level]', (e) => { store.set('botLevel', +e.currentTarget.dataset.level); vibrate(8); renderTab(); });
    on('[data-color]', (e) => { store.set('botColor', e.currentTarget.dataset.color); renderTab(); });
    on('[data-bot]', () => {
      const c = store.get('botColor', 'white');
      const color = c === 'white' ? Chess.WHITE : c === 'black' ? Chess.BLACK : (Math.random() < 0.5 ? Chess.WHITE : Chess.BLACK);
      openBotGame(store.get('botLevel', 1), color);
    });
    on('[data-need-account]', () => openAccount());
    on('[data-find]', () => {
      lobby = { phase: 'searching', error: '' };
      lobby.stop = Online.findRandom(tcCode, (id) => startOnline(id));
      renderTab();
    });
    on('[data-cancel]', () => { if (lobby.stop) lobby.stop(); lobby = { phase: 'idle', error: '' }; renderTab(); });
    on('[data-create]', async () => {
      lobby = { phase: 'joining', error: '' }; renderTab();
      try {
        const r = await Online.createFriend(tcCode, (id) => startOnline(id));
        lobby = { phase: 'waiting', code: r.code, stop: r.stop, error: '' };
      } catch (e) { lobby = { phase: 'idle', error: Online.friendly(e) }; }
      renderTab();
    });
    on('[data-share]', () => shareCode(lobby.code));
    const codeInput = $('[data-code]', main);
    if (codeInput) {
      codeInput.value = lobby.pendingCode || '';
      codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().split('').filter((c) => Online.CODE_ALPHABET.includes(c)).join('').slice(0, 6); });
    }
    on('[data-join]', () => joinCode(codeInput ? codeInput.value : ''));
  }

  async function joinCode(code) {
    lobby = { phase: 'joining', error: '' }; renderTab();
    try { const id = await Online.joinFriend(code); startOnline(id); }
    catch (e) { lobby = { phase: 'idle', error: e.message, pendingCode: code }; renderTab(); }
  }

  function shareCode(code) {
    const url = location.origin + location.pathname + '?join=' + code;
    const text = T(`Сыграем в шахматы в SitChess! Код: ${code}`, `Let's play chess in SitChess! Code: ${code}`);
    if (navigator.share) navigator.share({ title: 'SitChess', text, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text + '\n' + url).then(() => toast(T('Ссылка скопирована', 'Link copied')));
    else toast(url);
  }

  function notConfigured() {
    return `<div class="muted small" style="background:var(--soft);padding:12px;border-radius:12px">🔌 ${T('Онлайн ещё не подключён владельцем сайта. Уроки и игра с Бобиком работают без него.', "Online isn't connected by the site owner yet. Lessons and games with Bobik work without it.")}</div>`;
  }

  async function startOnline(id) {
    lobby = { phase: 'idle', error: '' };
    try {
      const session = await Online.openGame(id);
      openOnlineGame(session);
    } catch (e) { lobby.error = e.message; }
    renderTab();
  }

  // ---------- Game screen pieces ----------
  function pbar({ name, sub, profile, bobikBar, active, clock }) {
    const av = bobikBar ? `<div class="avatar av" style="width:40px;height:40px;background:var(--soft)">${bobik(34, true)}</div>` : avatar(profile || { name }, 40);
    return `<div class="pbar ${active ? 'active' : ''}">${av}<div class="info"><div class="name">${esc(name)}</div><div class="sub">${sub}</div></div>
      ${clock !== undefined ? `<div class="clock" data-clock="${clock}">0:00</div>` : `<div class="${active ? 'dot-on' : ''}"></div>`}</div>`;
  }

  function capturedSub(text, game, color) {
    const caps = game.captured(color);
    const bal = Chess.materialBalance(game.pos) * (color === Chess.WHITE ? 1 : -1);
    return `${esc(text)} <span>${miniPieces(caps, color ^ 1)}</span>${bal > 0 ? `<b>+${bal}</b>` : ''}`;
  }

  function moveList(game) {
    const rows = game.numbered();
    if (!rows.length) return `<span class="faint">${T('Ходов пока нет', 'No moves yet')}</span>`;
    return rows.map(([n, w, b]) => `<span><span class="n">${n}.</span> ${esc(w)} ${esc(b)}</span>`).join('');
  }

  function fmtClock(t) {
    t = Math.max(0, t);
    if (t < 10) return '0:' + t.toFixed(1).padStart(4, '0');
    const s = Math.floor(t);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function resultModal({ outcome, reason, xp, primary, onPrimary, onReview, onView }) {
    const title = outcome === 'win' ? T('Победа! 🏆', 'You won! 🏆') : outcome === 'loss' ? T('Поражение', 'You lost') : T('Ничья 🤝', 'Draw 🤝');
    const line = outcome === 'win' ? T('Вот это игра! Бобик в восторге!', 'What a game! Bobik is thrilled!')
      : outcome === 'loss' ? T('Не грусти — каждое поражение учит. Посмотрим оценку Бобика?', "Don't be sad — every loss teaches. See Bobik's review?")
        : T('Крепкая партия! Никто не уступил.', 'A solid game! Nobody gave in.');
    const xpHtml = xp === undefined || xp === null ? '' : `<div class="xp-pill" style="color:${xp > 0 ? 'var(--success)' : xp < 0 ? 'var(--danger)' : 'var(--ink-2)'}">${xp > 0 ? '+' + xp : xp === 0 ? '±0' : xp} XP</div>`;
    const m = modal(`<div style="display:flex;justify-content:center">${bobik(96)}</div><h2 style="margin:0">${title}</h2><div class="muted">${esc(reason)}</div>${xpHtml}
      <div class="small muted">${line}</div>
      <button class="btn" data-review>✨ ${T('Оценка Бобика ⭐️', "Bobik's review ⭐️")}</button>
      <button class="btn soft" data-primary>${primary}</button>
      <button class="btn soft" data-view>${T('Посмотреть доску', 'View the board')}</button>`);
    $('[data-review]', m.el).addEventListener('click', () => { m.close(); onReview(); });
    $('[data-primary]', m.el).addEventListener('click', () => { m.close(); onPrimary(); });
    $('[data-view]', m.el).addEventListener('click', () => { m.close(); if (onView) onView(); });
    if (outcome === 'win') sound.win();
  }

  // ---------- Bot game ----------
  function openBotGame(levelId, color) {
    const level = LEVELS[levelId - 1];
    const botName = T('Бобик · ', 'Bobik · ') + levelTitle(level);
    const scr = html(`<div class="overlay-screen" role="dialog" aria-label="${T('Игра с Бобиком', 'Playing Bobik')}"><div class="game">
      <div class="top"><button class="icon-btn" data-x aria-label="${T('Закрыть', 'Close')}">✕</button>
        <div class="title"><b>${T('Игра с Бобиком', 'Playing Bobik')}</b><small>${level.emoji} ${levelTitle(level)} · ${level.xp} XP</small></div>
        <button class="icon-btn" data-flip aria-label="${T('Перевернуть доску', 'Flip the board')}">⇅</button>
        <button class="icon-btn" data-new aria-label="${T('Новая игра', 'New game')}">↻</button></div>
      <div class="boardcol"><div data-opp style="width:100%"></div><div data-board style="width:100%;display:flex;justify-content:center"></div><div data-me style="width:100%"></div></div>
      <div class="side"><div class="moves" data-moves></div><div class="controls" data-ctl></div></div></div></div>`);
    document.body.appendChild(scr);
    let game = new Chess.Game(), thinking = false, hint = [], flipped = false, token = 0, saved = false;
    const board = new Board($('[data-board]', scr), { onMove: (m) => playerMove(m) });
    const close = () => { token++; scr.remove(); renderTab(); };
    $('[data-x]', scr).addEventListener('click', close);
    $('[data-flip]', scr).addEventListener('click', () => { flipped = !flipped; draw(); });
    $('[data-new]', scr).addEventListener('click', () => newGame());

    const outcome = () => { const r = game.result(); if (!r.over) return null; if (r.winner === null) return 'draw'; return r.winner === color ? 'win' : 'loss'; };

    function draw() {
      const r = game.result(), over = r.over;
      $('[data-opp]', scr).innerHTML = pbar({ name: botName, bobikBar: true, active: !over && game.pos.turn !== color,
        sub: capturedSub(thinking ? T('думает…', 'thinking…') : `${level.emoji} ${level.xp} XP`, game, color ^ 1) });
      $('[data-me]', scr).innerHTML = pbar({ name: myName(), profile: me(), active: !over && game.pos.turn === color, sub: capturedSub(T('ты', 'you'), game, color) });
      board.set({ pos: game.pos, last: game.lastMove, flipped: (color === Chess.BLACK) !== flipped, arrows: hint, movable: !thinking && !over ? color : null });
      const mv = $('[data-moves]', scr); mv.innerHTML = moveList(game); mv.scrollLeft = mv.scrollWidth;
      const ctl = $('[data-ctl]', scr);
      ctl.innerHTML = `<button class="btn soft" data-undo ${thinking || !game.moves.length || over ? 'disabled' : ''}>↶ ${T('Назад', 'Undo')}</button>
        <button class="btn soft" data-hint ${thinking || over || game.pos.turn !== color ? 'disabled' : ''}>💡 ${T('Подсказка', 'Hint')}</button>
        ${over ? `<button class="btn" data-review>✨ ${T('Оценка', 'Review')}</button>` : `<button class="btn soft" data-resign>🏳 ${T('Сдаться', 'Resign')}</button>`}`;
      const b = (s, fn) => { const el = $(s, ctl); if (el) el.addEventListener('click', fn); };
      b('[data-undo]', undo); b('[data-hint]', showHint); b('[data-review]', review);
      b('[data-resign]', () => {
        const m = modal(`<h3 style="margin:0">${T('Сдаться?', 'Resign?')}</h3><button class="btn danger" data-yes>${T('Сдаться', 'Resign')}</button><button class="btn soft" data-close>${T('Отмена', 'Cancel')}</button>`);
        $('[data-yes]', m.el).addEventListener('click', () => { m.close(); game.forced = { over: true, kind: 'resignation', winner: color ^ 1 }; finish(); });
      });
    }

    function playerMove(m) {
      const cap = game.pos.b[Chess.mTo(m)];
      if (!game.play(m)) { board.rebuild(); return; }
      (cap ? sound.capture : sound.move)();
      hint = [];
      if (game.result().over) { draw(); finish(); return; }
      botMove();
    }

    async function botMove() {
      thinking = true; draw();
      const my = ++token, started = Date.now();
      const m = await engine.bot(game.pos, levelId, game.positions);
      const wait = 450 - (Date.now() - started);
      if (wait > 0) await new Promise((r) => setTimeout(r, wait));
      if (my !== token) return;
      thinking = false;
      if (m) { const cap = game.pos.b[Chess.mTo(m)]; if (game.play(m)) { (cap ? sound.capture : sound.move)(); vibrate(10); } }
      draw();
      if (game.result().over) finish();
    }

    function undo() {
      token++;
      thinking = false;
      game.undo(Math.min(game.pos.turn === color ? 2 : 1, game.moves.length));
      hint = [];
      draw();
      if (game.pos.turn !== color) botMove();
    }

    async function showHint() {
      thinking = true; draw();
      const p = game.pos, m = await engine.hint(p);
      thinking = false;
      if (m && p === game.pos) hint = [[Chess.mFrom(m), Chess.mTo(m)]];
      draw();
    }

    function newGame() { token++; game = new Chess.Game(); thinking = false; hint = []; saved = false; draw(); if (color === Chess.BLACK) botMove(); }

    function review() {
      openReview(game.moves.map(Chess.uci), color === Chess.WHITE ? myName() : botName, color === Chess.BLACK ? myName() : botName, color);
    }

    function finish() {
      const o = outcome();
      if (!o) return;
      if (!saved) {
        saved = true;
        if (o === 'win') Stats.botWin(levelId);
        Stats.day();
        History.add({ date: Date.now(), opponent: botName, kind: 'bot', result: o, moves: game.moves.length, uci: game.moves.map(Chess.uci), color });
      }
      vibrate(o === 'win' ? [30, 50, 30] : 40);
      draw();
      resultModal({ outcome: o, reason: resultText(game.result().kind), primary: T('Ещё партию', 'Play again'), onPrimary: newGame, onReview: review });
    }

    draw();
    if (color === Chess.BLACK) botMove();
  }

  // ---------- Online game ----------
  function openOnlineGame(s) {
    const tci = tcInfo(s.tc.code);
    const scr = html(`<div class="overlay-screen" role="dialog"><div class="game">
      <div class="top"><div class="title" style="text-align:left"><b>${s.ranked ? T('Рейтинговая партия', 'Ranked game') : T('Игра с другом', 'Game with a friend')}</b><small>${tci.icon} ${tci.title} · ${tci.kind}</small></div>
        <button class="icon-btn" data-flip aria-label="${T('Перевернуть доску', 'Flip the board')}">⇅</button><button class="link hidden" data-leave>${T('Выйти', 'Leave')}</button></div>
      <div class="boardcol"><div data-opp style="width:100%"></div><div data-offer style="width:100%"></div><div data-board style="width:100%;display:flex;justify-content:center"></div><div data-me style="width:100%"></div></div>
      <div class="side"><div class="moves" data-moves></div><div class="controls" data-ctl></div><div class="status-line" data-status></div></div></div></div>`);
    document.body.appendChild(scr);
    let flipped = false, shown = false, saved = false;
    const board = new Board($('[data-board]', scr), { onMove: (m) => { const cap = s.game.pos.b[Chess.mTo(m)]; if (s.play(m)) (cap ? sound.capture : sound.move)(); else board.rebuild(); } });
    const close = () => { s.disconnect(); clearInterval(clockTimer); off(); scr.remove(); renderTab(); };
    $('[data-flip]', scr).addEventListener('click', () => { flipped = !flipped; draw(); });
    $('[data-leave]', scr).addEventListener('click', close);
    const xpChange = () => (!s.ranked ? null : s.outcome === 'win' ? Online.STEP : s.outcome === 'loss' ? -Online.STEP : 0);
    const review = () => openReview(s.game.moves.map(Chess.uci), s.myColor === Chess.WHITE ? myName() : s.opponent.name, s.myColor === Chess.BLACK ? myName() : s.opponent.name, s.myColor);

    function draw() {
      const opp = s.opponentProfile || s.opponent, mine = me(), r = s.result;
      $('[data-opp]', scr).innerHTML = pbar({ name: s.opponent.name, profile: opp, active: !r && !s.isMyTurn,
        sub: capturedSub(`${opp.xp || s.opponent.xp || 0} XP · ${rank(opp.xp || 0).title}`, s.game, s.myColor ^ 1), clock: s.hasClock ? s.myColor ^ 1 : undefined });
      $('[data-me]', scr).innerHTML = pbar({ name: myName(), profile: mine, active: !r && s.isMyTurn,
        sub: capturedSub(`${mine.xp || Online.START_XP} XP`, s.game, s.myColor), clock: s.hasClock ? s.myColor : undefined });
      board.set({ pos: s.game.pos, last: s.game.lastMove, flipped: (s.myColor === Chess.BLACK) !== flipped, movable: s.isMyTurn ? s.myColor : null });
      const mv = $('[data-moves]', scr); mv.innerHTML = moveList(s.game); mv.scrollLeft = mv.scrollWidth;
      $('[data-offer]', scr).innerHTML = s.drawOffer ? `<div class="banner"><b class="grow">${T('Соперник предлагает ничью', 'Your opponent offers a draw')}</b>
        <button class="link success" data-acc>${T('Принять', 'Accept')}</button><button class="link danger" data-dec>${T('Нет', 'No')}</button></div>` : '';
      const acc = $('[data-acc]', scr); if (acc) acc.addEventListener('click', () => s.acceptDraw());
      const dec = $('[data-dec]', scr); if (dec) dec.addEventListener('click', () => s.declineDraw());
      const ctl = $('[data-ctl]', scr);
      if (!r) {
        const offered = s.myDrawPly === s.game.moves.length;
        ctl.innerHTML = `<button class="btn soft" data-resign>🏳 ${T('Сдаться', 'Resign')}</button>
          <button class="btn soft" data-draw ${offered ? 'disabled' : ''}>🤝 ${offered ? T('Предложено', 'Offered') : T('Ничья?', 'Draw?')}</button>
          ${s.canClaimWin ? `<button class="btn" data-claim>🏆 ${T('Забрать победу', 'Claim win')}</button>` : ''}`;
      } else ctl.innerHTML = `<button class="btn" data-review>✨ ${T('Оценка Бобика', "Bobik's review")}</button><button class="btn soft" data-close-game>${T('Выйти', 'Leave')}</button>`;
      const b = (q, fn) => { const el = $(q, ctl); if (el) el.addEventListener('click', fn); };
      b('[data-resign]', () => {
        const m = modal(`<h3 style="margin:0">${T('Сдаться?', 'Resign?')}</h3><button class="btn danger" data-yes>${T('Сдаться', 'Resign')}</button><button class="btn soft" data-close>${T('Отмена', 'Cancel')}</button>`);
        $('[data-yes]', m.el).addEventListener('click', () => { m.close(); s.resign(); });
      });
      b('[data-draw]', () => s.offerDraw());
      b('[data-claim]', () => s.claimWin());
      b('[data-review]', review);
      b('[data-close-game]', close);
      $('[data-leave]', scr).classList.toggle('hidden', !r);
      const st = $('[data-status]', scr);
      if (!r) {
        const mins = Math.floor((Date.now() - s.lastOpponentActivity) / 60000);
        st.textContent = s.isMyTurn ? T('Твой ход', 'Your move') : (mins >= 1 && !s.hasClock ? T(`Соперник думает уже ${mins} мин…`, `The opponent has been thinking for ${mins} min…`) : T('Ход соперника…', "Opponent's move…"));
        st.style.color = s.isMyTurn ? 'var(--success)' : 'var(--ink-2)';
      } else st.textContent = '';
      updateClocks();
      if (r && !shown) {
        shown = true;
        if (!saved) {
          saved = true;
          if (!s.ranked) Stats.friend();
          Stats.day();
          History.add({ date: Date.now(), opponent: s.opponent.name, kind: s.ranked ? 'online' : 'friend', result: s.outcome, moves: s.game.moves.length, xp: xpChange() || 0, uci: s.game.moves.map(Chess.uci), color: s.myColor });
        }
        vibrate(s.outcome === 'win' ? [30, 50, 30] : 40);
        resultModal({ outcome: s.outcome, reason: resultText(r.kind), xp: xpChange(), primary: T('В меню', 'Back to menu'), onPrimary: close, onReview: review });
      }
    }

    function updateClocks() {
      $$('[data-clock]', scr).forEach((el) => {
        const c = +el.dataset.clock, t = s.timeLeft(c), active = !s.result && s.game.pos.turn === c;
        el.textContent = fmtClock(t);
        el.className = 'clock' + (active ? (t < 20 ? ' low' : ' on') : '');
      });
    }

    const off = s.on(() => draw());
    const clockTimer = setInterval(() => { updateClocks(); if (!s.result && !s.isMyTurn && !s.hasClock && s.canClaimWin && !$('[data-claim]', scr)) draw(); }, 100);
    draw();
  }

  // ---------- Review ----------
  function openReview(ucis, whiteName, blackName, myColor) {
    const scr = html(`<div class="overlay-screen" role="dialog" aria-label="${T('Оценка Бобика', "Bobik's review")}"><div class="page stack" style="padding-bottom:30px;max-width:620px">
      <div class="row"><button class="icon-btn" data-x aria-label="${T('Закрыть', 'Close')}">✕</button><div class="grow center bold">${T('Оценка Бобика', "Bobik's review")}</div><div style="width:42px"></div></div>
      <div data-body class="stack"></div></div></div>`);
    document.body.appendChild(scr);
    let alive = true;
    $('[data-x]', scr).addEventListener('click', () => { alive = false; scr.remove(); });
    const body = $('[data-body]', scr);
    body.innerHTML = `<div class="card stack center" style="align-items:center">${bobik(110)}
      <b>${T('Бобик внимательно смотрит каждый ход…', 'Bobik is looking at every move…')}</b>
      <div class="progress" style="width:100%"><i data-p style="width:0"></i></div><div class="muted small" data-n>0 / ${ucis.length + 1}</div>
      <div class="faint small">${T('Оценка честная: Бобик сравнивает каждый ход с лучшим, который он нашёл.', 'The review is honest: Bobik compares each move with the best one he found.')}</div></div>`;
    engine.review(ucis, (d, t) => {
      if (!alive) return;
      $('[data-p]', body).style.width = (d / t) * 100 + '%';
      $('[data-n]', body).textContent = `${d} / ${t}`;
    }).then((rv) => { if (alive) show(rv); });

    function show(rv) {
      const counts = (c, q) => rv.filter((r) => r.mover === c && r.quality === q).length;
      const head = (name, c) => `<td class="n"><div class="mini-pc ${c ? 'b' : 'w'}" style="font-size:22px">${SC.glyph(Chess.piece(Chess.K, c))}</div><div class="tiny bold">${esc(name)}${myColor === c ? T(' (ты)', ' (you)') : ''}</div></td>`;
      body.innerHTML = `<div class="card"><table class="rv-table">
          <tr><td></td>${head(whiteName, 0)}${head(blackName, 1)}</tr>
          <tr><td class="bold">${T('Точность', 'Accuracy')}</td><td class="n"><span class="acc">${Chess.accuracy(rv, 0)}%</span></td><td class="n"><span class="acc">${Chess.accuracy(rv, 1)}%</span></td></tr>
          ${Chess.QUALITIES.map((q) => `<tr><td><span class="q-badge" style="background:${QUALITY[q].color}">${QUALITY[q].sym}</span> ${qTitle(q)}</td>
            ${[0, 1].map((c) => { const n = counts(c, q); return `<td class="n" style="color:${n ? QUALITY[q].color : 'var(--ink-3)'}">${n}</td>`; }).join('')}</tr>`).join('')}
        </table></div>
        <div class="card stack"><div class="row" data-verdict style="min-height:48px"></div><div data-board></div>
          <div class="controls"><button class="btn soft" data-go="first">⏮</button><button class="btn soft" data-go="prev">◀</button><button class="btn soft" data-go="next">▶</button><button class="btn soft" data-go="last">⏭</button></div>
          <div class="chips" data-chips></div><button class="btn soft" data-mistake>⚠️ ${T('Следующая ошибка', 'Next mistake')}</button></div>`;
      const board = new Board($('[data-board]', body), {});
      let index = rv.length;
      const go = (i) => {
        index = Math.max(0, Math.min(rv.length, i));
        const g = new Chess.Game();
        for (const u of ucis.slice(0, index)) g.playUci(u);
        const cur = index > 0 ? rv[index - 1] : null;
        board.set({ pos: g.pos, last: g.lastMove, flipped: myColor === Chess.BLACK, arrows: cur && cur.best ? [[Chess.mFrom(cur.best), Chess.mTo(cur.best)]] : [] });
        const v = $('[data-verdict]', body);
        if (cur) {
          const Q = QUALITY[cur.quality];
          const evalTxt = Math.abs(cur.evalWhite) > Chess.MATE - 1000 ? (cur.evalWhite > 0 ? T('Мат белым', 'White mates') : T('Мат чёрным', 'Black mates'))
            : T('Оценка: ', 'Eval: ') + (cur.evalWhite >= 0 ? '+' : '') + (cur.evalWhite / 100).toFixed(1);
          v.innerHTML = `<span style="font-size:30px">${Q.emoji}</span><div class="grow"><div class="bold" style="color:${Q.color}">${Math.floor(cur.ply / 2) + 1}${cur.mover ? '…' : '.'} ${esc(cur.san)} — ${qTitle(cur.quality)}</div>
            <div class="muted small">${cur.bestSan && cur.quality !== 'best' && cur.quality !== 'brilliant' ? T(`Бобик сыграл бы ${esc(cur.bestSan)} — стрелка на доске`, `Bobik would play ${esc(cur.bestSan)} — see the arrow`) : evalTxt}</div></div>`;
        } else v.innerHTML = `${bobik(40, true)}<span class="muted">${T('Листай ходы — Бобик оценит каждый', 'Step through the moves — Bobik rates each one')}</span>`;
        $$('.mchip', body).forEach((c) => { const on = +c.dataset.i === index; c.style.background = on ? QUALITY[rv[+c.dataset.i - 1].quality].color + '40' : ''; if (on) c.scrollIntoView({ block: 'nearest', inline: 'center' }); });
      };
      $('[data-chips]', body).innerHTML = rv.map((r) => `<button class="mchip" data-i="${r.ply + 1}">${r.mover ? '' : `<span class="faint">${Math.floor(r.ply / 2) + 1}.</span>`}${esc(r.san)} <b style="color:${QUALITY[r.quality].color}">${QUALITY[r.quality].sym}</b></button>`).join('');
      $$('.mchip', body).forEach((c) => c.addEventListener('click', () => go(+c.dataset.i)));
      $$('[data-go]', body).forEach((b) => b.addEventListener('click', () => go({ first: 0, prev: index - 1, next: index + 1, last: rv.length }[b.dataset.go])));
      const mistakes = rv.filter((r) => (r.quality === 'blunder' || r.quality === 'inaccuracy') && (myColor === undefined || myColor === null || r.mover === myColor));
      const mb = $('[data-mistake]', body);
      if (!mistakes.length) mb.classList.add('hidden');
      mb.addEventListener('click', () => { const n = mistakes.find((r) => r.ply + 1 > index) || mistakes[0]; go(n.ply + 1); });
      go(rv.length);
    }
  }

  // ---------- Avatar editor ----------
  function openAvatarEditor() {
    const cur = me(), parsed = SC.parseAvatar(cur.avatar);
    let emoji = parsed ? parsed.emoji : '🦊', color = parsed ? parsed.color : SC.colorFor(cur.name || '?'), photo = cur.photo || '', usePhoto = !!cur.photo;
    const m = modal(`<h3 style="margin:0">${T('Аватарка', 'Avatar')}</h3><div data-prev style="display:flex;justify-content:center"></div>
      <div class="seg"><button data-mode="emoji">${T('Эмодзи', 'Emoji')}</button><button data-mode="photo">${T('Фото', 'Photo')}</button></div>
      <div data-emoji class="stack"><div class="color-row" style="justify-content:center">${SC.AV_COLORS.map((c, i) => `<button data-c="${i}" style="background:linear-gradient(135deg,${c[0]},${c[1]})" aria-label="${T('Цвет', 'Colour')} ${i + 1}"></button>`).join('')}</div>
        <div class="emoji-grid">${SC.AV_EMOJI.map((e) => `<button data-e="${e}">${e}</button>`).join('')}</div></div>
      <div data-photo class="stack"><label class="btn soft">📷 ${T('Выбрать фото', 'Choose a photo')}<input type="file" accept="image/*" hidden data-file></label>
        <div class="faint small">${T('Фото увидят другие игроки в таблице и в партиях.', 'Other players will see the photo in the table and in games.')}</div></div>
      <button class="btn" data-save>${T('Сохранить', 'Save')}</button><button class="btn soft" data-close>${T('Отмена', 'Cancel')}</button>`);
    const el = m.el;
    const draw = () => {
      $('[data-prev]', el).innerHTML = avatar({ name: cur.name, avatar: usePhoto ? '' : `${emoji}|${color}`, photo: usePhoto ? photo : '' }, 110);
      $$('[data-mode]', el).forEach((b) => b.classList.toggle('on', (b.dataset.mode === 'photo') === usePhoto));
      $('[data-emoji]', el).classList.toggle('hidden', usePhoto);
      $('[data-photo]', el).classList.toggle('hidden', !usePhoto);
      $$('[data-c]', el).forEach((b) => b.classList.toggle('on', +b.dataset.c === color));
      $$('[data-e]', el).forEach((b) => b.classList.toggle('on', b.dataset.e === emoji));
      $('[data-save]', el).disabled = usePhoto && !photo;
    };
    $$('[data-mode]', el).forEach((b) => b.addEventListener('click', () => { usePhoto = b.dataset.mode === 'photo'; draw(); }));
    $$('[data-c]', el).forEach((b) => b.addEventListener('click', () => { color = +b.dataset.c; draw(); }));
    $$('[data-e]', el).forEach((b) => b.addEventListener('click', () => { emoji = b.dataset.e; draw(); }));
    $('[data-file]', el).addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => {
        const side = 200, c = document.createElement('canvas'); c.width = c.height = side;
        const s = side / Math.min(img.width, img.height), w = img.width * s, h = img.height * s;
        c.getContext('2d').drawImage(img, (side - w) / 2, (side - h) / 2, w, h);
        photo = c.toDataURL('image/jpeg', 0.75); URL.revokeObjectURL(img.src); draw();
      };
      img.src = URL.createObjectURL(f);
    });
    $('[data-save]', el).addEventListener('click', async () => {
      const av = usePhoto ? '' : `${emoji}|${color}`, ph = usePhoto ? photo : '';
      const local = store.get('profile', {}) || {}; local.avatar = av; local.photo = ph; store.set('profile', local);
      if (Online.user) await Online.updateAvatar(av, ph).catch((e) => toast(Online.friendly(e)));
      m.close(); vibrate(20); renderTab();
    });
    draw();
  }

    const offline = !Online.configured;
    function draw() {
      container.innerHTML = `<div class="stack">
        ${says(offline ? T('Давай знакомиться! Как тебя зовут?', "Let's get to know each other! What's your name?")

        <div class="field"><label>Email</label><input class="input" data-email type="email" placeholder="you@example.com" autocomplete="email"></div>

        <div class="faint small">${offline ? T('Профиль сохранится на этом устройстве.', 'Your profile is saved on this device.') : T('Email виден только тебе и нужен для входа.', 'Only you can see your email; it is used to sign in.')}</div>
        <div class="danger small" data-err></div>
        <button class="btn" data-submit>${mode === 'register' ? T('Сохранить аккаунт', 'Save account') : T('Войти', 'Sign in')}</button>
        ${offline ? '' : mode === 'register' ? `<button class="btn soft" data-switch>${T('У меня уже есть аккаунт', 'I already have an account')}</button>`
          : `<button class="btn soft" data-switch>${T('Создать новый аккаунт', 'Create a new account')}</button><button class="link" data-forgot>${T('Забыл пароль', 'Forgot password')}</button>`}
        ${allowSkip ? `<button class="link" data-skip>${T('Пока просто учиться — без аккаунта', 'Just learn for now — no account')}</button>` : ''}
      </div>`;
      const nameEl = $('[data-name]', container), emailEl = $('[data-email]', container), passEl = $('[data-pass]', container);
      const local = store.get('profile', {}) || {};
      if (nameEl) nameEl.value = local.name || '';
      emailEl.value = local.email || '';
      const err = (t) => { $('[data-err]', container).textContent = t || ''; };
      const validate = () => {
        const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(emailEl.value.trim());
        const nameOk = mode !== 'register' || (check && (check.state === 'available' || check.state === 'mine'));
        const passOk = offline || (passEl && passEl.value.length >= 6);
        $('[data-submit]', container).disabled = busy || !emailOk || !nameOk || !passOk;
      };
      if (nameEl) {
        const runCheck = () => {
          clearTimeout(checkTimer);
          const v = nameEl.value, msg = $('[data-name-msg]', container);
          const bad = Online.validateName(v);
          if (bad) { check = v ? { state: 'invalid', text: bad } : null; showCheck(); validate(); return; }
          msg.innerHTML = `<span class="faint">${T('Проверяем…', 'Checking…')}</span>`;
          check = null; validate();
          checkTimer = setTimeout(async () => { const r = await Online.checkName(v); if (nameEl.value === v) { check = r; showCheck(); validate(); } }, 450);
        };
        const showCheck = () => {
          const msg = $('[data-name-msg]', container);
          nameEl.classList.remove('ok', 'bad');
          if (!check) { msg.textContent = ''; return; }
          const map = {
            available: [T('Имя свободно ✨', 'The name is free ✨'), 'success', 'ok'], mine: [T('Это твоё имя', 'This is your name'), 'success', 'ok'],
            taken: [T('Это имя уже занято. Придумай другое.', 'This name is already taken. Choose another one.'), 'danger', 'bad'],
            invalid: [check.text, 'danger', 'bad'], failed: [check.text, 'danger', '']
          };
          const [t, c, cls] = map[check.state];
          msg.innerHTML = `<span class="${c}">${esc(t)}</span>`;
          if (cls) nameEl.classList.add(cls);
        };
        nameEl.addEventListener('input', runCheck);
        if (nameEl.value) runCheck();
      }
      [emailEl, passEl].forEach((x) => x && x.addEventListener('input', validate));
      validate();
      $('[data-submit]', container).addEventListener('click', async () => {
        err(''); busy = true; validate();
        $('[data-submit]', container).innerHTML = '<div class="spinner"></div>';
        try {
          const email = emailEl.value.trim();
          if (offline) {
            const p = store.get('profile', {}) || {}; p.name = nameEl.value.trim(); p.email = email; store.set('profile', p);
          } else if (mode === 'register') {
            await Online.register(nameEl.value, email, passEl.value);
            const p = store.get('profile', {}) || {}; p.name = nameEl.value.trim(); p.email = email; store.set('profile', p);
          } else {
            await Online.login(email, passEl.value);
            const p = store.get('profile', {}) || {}; p.email = email; store.set('profile', p);
          }
          vibrate(25); sound.good();
          onDone();
        } catch (e) { busy = false; draw(); $('[data-err]', container).textContent = e.message; }
      });
      const sw = $('[data-switch]', container); if (sw) sw.addEventListener('click', () => { mode = mode === 'register' ? 'login' : 'register'; check = null; draw(); });
      const fg = $('[data-forgot]', container);
      if (fg) fg.addEventListener('click', async () => {
        try { await Online.resetPassword(emailEl.value); toast(T('Письмо для сброса пароля отправлено', 'Password reset email sent')); } catch (e) { err(e.message); }
      });
      const sk = $('[data-skip]', container); if (sk) sk.addEventListener('click', () => onDone());
    }
    draw();
  }

  function openAccount() {
    const m = modal('<div data-form style="text-align:left"></div><button class="btn soft" data-close>' + T('Закрыть', 'Close') + '</button>');
    accountForm($('[data-form]', m.el), { allowSkip: false, onDone: () => { m.close(); renderTab(); handleJoinLink(); } });
  }

          <div class="faint small">${T('С Бобиком может научиться любой — даже если ты ни разу не видел шахматы.', "Anyone can learn with Bobik — even if you've never seen a chessboard.")}</div></div>`;
        $$('[data-lv]', box).forEach((b) => b.addEventListener('click', () => {
          const l = levels.find((x) => x[0] === b.dataset.lv);
          store.set('level', l[0]); store.set('startLesson', l[4]); vibrate(8); go(3);
        }));
      } else {
        box.innerHTML = `<div class="stack">${says(T('Последний шаг: выбери доску и тему — светлую или тёмную. Всё можно поменять в профиле.', 'Last step: pick a board and a light or dark theme. You can change both in your profile.'))}
          ${boardPicker()}

        new Board($('[data-preview]', box), {});

        $$('[data-ap]', box).forEach((b) => b.addEventListener('click', () => { SC.setSetting('appearance', b.dataset.ap); go(3); }));
        $('[data-go]', box).addEventListener('click', finish);
      }
    }
    go(store.get('onbStep', 0));
  }

  // ---------- Links like ?join=CODE ----------
  async function handleJoinLink() {
    const code = new URLSearchParams(location.search).get('join');
    if (!code) return;
    await Online.authReady;
    tab = 'play';
    renderShell();
    if (!Online.configured) { toast(T('Онлайн не подключён на этом сайте', 'Online is not connected on this site')); return; }
    if (!Online.user) { openAccount(); return; }
    history.replaceState(null, '', location.pathname);
    joinCode(code);
  }

  // ---------- Start ----------
  const boot = document.getElementById('boot');
  if (boot) boot.remove();
  try { Online.init(); } catch (e) { console.warn('Online init failed', e); }
  splash(() => {
    if (store.get('onboarded', false)) { renderShell(); handleJoinLink(); }
    else { renderShell(); startOnboarding(); }
  });
})();

</script>
